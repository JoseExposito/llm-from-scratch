[project]
name = "llm-from-scratch"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [{ name = "José Expósito", email = "jose.exposito89@gmail.com" }]

requires-python = "==3.12.13"
dependencies = [
    "datasets==4.8.4",
    "numpy==2.4.4",
    "torch==2.11.0",
    "transformers==5.12.1",
]

[dependency-groups]
dev = [
    "poethepoet==0.46.0",
    "ruff==0.15.17",
]

[project.optional-dependencies]
# Dependencias necesarias para ejecutar los distintos notebooks
notebooks = [
    "ipykernel==7.2.0",
    "ipywidgets==8.1.8",
    "matplotlib==3.10.9",
    "nltk==3.9.4",
    "pandas==3.0.2",
    "wordcloud==1.9.6",
]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[project.scripts]
llm_from_scratch = "llm_from_scratch.main:main"

[tool.poe.tasks]
test = "uv run python -m unittest discover -s tests -p 'test_*.py'"
lint = "uv run ruff check src/llm_from_scratch tests"
format = "uv run ruff format src/llm_from_scratch tests"
